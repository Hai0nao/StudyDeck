# Netlify builds this on every push to main (once the repo is linked in the Netlify UI).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  # Cloud sync. Both values are public: the publishable key only allows what row-level security permits.
  VITE_SUPABASE_URL = "https://zdnhvcqtfoldsxwfqsno.supabase.co"
  VITE_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_3cpJEKiPcp9TP-IYzfrULw_3qXXuXcP"

# The service worker and HTML must always be revalidated so updates reach users.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# Hashed build assets never change.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
